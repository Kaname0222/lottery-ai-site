version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lottery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lottery_pass}
      POSTGRES_DB: lottery_ai
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lottery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottery -d lottery_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: lottery_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lottery:${POSTGRES_PASSWORD:-lottery_pass}@db/lottery_ai
      APP_ENV: production
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lottery_network
    volumes:
      - backend_logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: lottery_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - lottery_network

  certbot:
    image: certbot/certbot
    container_name: lottery_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - lottery_network

volumes:
  postgres_data:
  backend_logs:
  certbot_data:
  certbot_www:

networks:
  lottery_network:
    driver: bridge
